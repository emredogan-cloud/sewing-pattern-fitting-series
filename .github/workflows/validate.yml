# =============================================================================
# TRUE FIT — SEWING PATTERN FITTING SERIES — KALİTE KAPILARI
# =============================================================================
# Desen: kardeş projelerin validate.yml'i.
#
# TASARIM: bu iş akışı ÜÇÜNCÜ TARAF PAKET KURMAZ. Bütün kalite kapıları
# Python standart kütüphanesiyle yazıldı — iş akışı saniyeler içinde biter.
#
# İKİ KAPI KATMANI okunur: seri kapısı (.gate) ve üç kitap kapısı
# (BOOK-*/.gate). Biri diğerinin yerine geçmez (DECISIONS.md K3).
# =============================================================================
name: validate

on:
  push:
    branches: [main, master, 'faz/**', 'fix/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: kapı seviyelerini oku
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.read.outputs.series }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          SERIES="bootstrap"
          if [ -f .gate ]; then SERIES="$(tr -d '[:space:]' < .gate)"; fi
          case "$SERIES" in
            bootstrap|series-architecture|production|catalog|release) ;;
            *) echo "::error::seri .gate geçersiz: '$SERIES'"; exit 1 ;;
          esac
          echo "series=$SERIES" >> "$GITHUB_OUTPUT"
          echo "::notice::seri kapısı = $SERIES"
          for d in BOOK-01-* BOOK-02-* BOOK-03-*; do
            B="init"
            if [ -f "$d/.gate" ]; then B="$(tr -d '[:space:]' < "$d/.gate")"; fi
            case "$B" in
              init|foundation|phase1-spec|phase2-visual|phase4-production-conditional|phase5-qa-internal|phase3-pilot|phase4-production|phase5-qa|phase6-format|release) ;;
              *) echo "::error::$d/.gate geçersiz: '$B'"; exit 1 ;;
            esac
            echo "::notice::$d kapısı = $B"
          done

  spec:
    name: şema · bütünlük · kaynak otoritesi
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: validate_spec
        run: |
          python3 06_BUILD/validate_spec.py \
            --gate "${{ needs.gates.outputs.series }}" \
            --verbose --json 08_REPORTS/tracked/spec-validation.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: spec-validation
          path: 08_REPORTS/tracked/spec-validation.json

  structure:
    name: depo · koruma · marka · izolasyon
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 06_BUILD/validate_structure.py --verbose --json 08_REPORTS/tracked/structure-validation.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: structure-validation
          path: 08_REPORTS/tracked/structure-validation.json

  crosswalk:
    name: crosswalk tazeliği + bütünlüğü
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 06_BUILD/build_crosswalk.py --check
      - name: crosswalk bütünlük denetimi (dokuz ilişki)
        run: python3 06_BUILD/qa_crosswalk.py --verbose --json 08_REPORTS/tracked/crosswalk-qa.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: crosswalk-qa
          path: 08_REPORTS/tracked/crosswalk-qa.json

  boundary:
    name: kitap sınırı (seriye özgü)
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 06_BUILD/qa_boundary.py --verbose --json 08_REPORTS/tracked/boundary-qa.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: boundary-qa
          path: 08_REPORTS/tracked/boundary-qa.json

  graph:
    name: nedensel çizge · doğrulama adımı kapısı
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      # ⚠ DÜRÜST SINIR — temiz klon denetiminde ÖLÇÜLDÜ: graph_audit
      # ve run_synthetic YALNIZCA taksonomiye bakar ve burada TAM
      # KAPSAMLA koşar. qa_verification'ın YEDİ denetimi ise okur
      # metnini okur ve manüskript prozası bilerek izlenmiyor (K9);
      # o denetimler burada ATLANIR ve kapı bunu çıktısında YAZAR.
      # İlk yazdığım yorum "üçü de tam kapsamla koşar" diyordu ve
      # YANLIŞTI — temiz klon koşumu düzeltti.
      - name: doğrulama adımı kapısı (L-2 · yapısal kapsam)
        run: |
          python3 06_BUILD/qa_verification.py --verbose
          echo "::notice::Okur metni izlenmiyor; bu kapının tam kapsamı YEREL koşumdadır."
      - name: nedensel çizge denetimi
        run: python3 07_TESTS/synthetic/graph_audit.py --verbose
      - name: sentetik profil + diferansiyel simülasyon
        run: python3 07_TESTS/synthetic/run_synthetic.py

  claims:
    name: iddia disiplini · terminoloji
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 06_BUILD/qa_claims.py --verbose
      - run: python3 06_BUILD/qa_terminology.py --verbose

  visual:
    name: görsel sistem (figür sicili · token kalibrasyonu · sayfa geometrisi)
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: qa_visual
        run: python3 06_BUILD/qa_visual.py --verbose --json 08_REPORTS/tracked/visual-qa.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-qa
          path: 08_REPORTS/tracked/visual-qa.json

  selftest:
    name: KAPILARIN KENDİ TESTİ
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 07_TESTS/selftest.py

  render:
    name: RENDER KATMANI (figür motoru · çizim yasakları)
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: sistem aracı (pdftoppm)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: render bağımlılıkları
        run: pip install -r 07_TESTS/requirements-render.txt
      - name: yazı tiplerini edin ve SHA-256 ile doğrula
        run: python3 06_BUILD/fetch_fonts.py
      - name: ÇİZİM YASAKLARININ KENDİ TESTİ
        run: python3 07_TESTS/selftest_visual.py
      - name: figür motoru — sicil GÜNCEL mi
        run: |
          python3 06_BUILD/figure_engine.py --book book-01
          git diff --exit-code -- BOOK-01-MEASURE-AND-DIAGNOSE/03_VISUAL/figures.json \
            || { echo "::error::figures.json BAYAT — motoru çalıştırıp commit edin."; exit 1; }
      - name: token kalibrasyonu — rapor GÜNCEL mi
        run: |
          python3 06_BUILD/calibrate_tokens.py
          git diff --stat -- 03_VISUAL/calibration_report.json
      # ⚠ DÜRÜST SINIR: baskı simülasyonu ÜRETİLEN PDF'i ölçer ve o
      # PDF manüskript prozasından kurulur — proza bilerek izlenmiyor
      # (K9), yani CI onu KURAMAZ. Bu kapının tam kapsamı YEREL
      # koşumdadır ve qa_all.sh içinde durur. Burada yalnızca ARACIN
      # kendisi çalışabiliyor mu, o denetlenir: çıkış kodu 1 (kusur)
      # ile 2 (varlık yok) ayrı şeylerdir ve karıştırılmaz.
      # ⚠ CI kitabı KURAMAZ (proza izlenmiyor, K9), yani basılacak bir
      # PDF hiç yoktur ve print_sim burada HER ZAMAN "yayın varlığı YOK"
      # der. İlk yazdığım adım bunu ham çıkış koduyla bırakıyordu ve
      # GitHub `bash -e` kullandığı için iş DÜŞTÜ — bir kapının, ölçmesi
      # imkânsız olan şey yüzünden kırmızı yanması bilgi değil gürültüdür.
      # Adım artık GERÇEK bir iddia sınar: araç koşmalı ve varlığın
      # yokluğunu DOĞRU kodla (1) bildirmelidir. 0 dönerse olmayan bir
      # dosyayı ölçtüğünü söylüyordur; 2+ dönerse çökmüştür. İkisi de kusurdur.
      - name: baskı simülasyonu — araç doğru davranıyor mu
        run: |
          set +e
          OUT=$(python3 06_BUILD/print_sim.py --verbose 2>&1); RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 2 ]; then
            echo "::error::print_sim ARAÇSIZ kaldı — render işinde poppler/Pillow kurulu olmalı."
            exit 1
          fi
          if [ "$RC" -ne 1 ]; then
            echo "::error::print_sim çıkış kodu $RC — CI'da yayın varlığı YOKTUR ve 1 beklenir."
            exit 1
          fi
          echo "$OUT" | grep -q "yayın varlığı YOK" || {
            echo "::error::print_sim 1 döndü ama gerekçesi 'yayın varlığı YOK' değil."; exit 1; }
          echo "::notice::print_sim doğru davrandı; TAM kapsamı YEREL koşumdadır (qa_all.sh)."

  manuscript:
    name: iddia sicili · izlenebilirlik · manüskript kapısı
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: iddia sicili GÜNCEL mi
        run: python3 06_BUILD/build_claims.py --check --book book-01
      - name: iddia→kaynak haritası GÜNCEL mi
        run: python3 06_BUILD/build_claim_map.py --check --book book-01
      - name: manüskript kapısı
        # ⚠ DÜRÜST SINIR: manüskript prozası BİLEREK izlenmiyor
        # (.gitignore § ①, DECISIONS.md K9). Temiz bir klonda bu kapı
        # PROZAYI göremez ve kendini ATLAR — çıktı bunu açıkça söyler.
        # Bölüm yapısı, yeniden gözlem döngüsü ve kalibre dil denetimi
        # bu yüzden YERELDE koşulmak zorundadır; CI onların yerine geçmez.
        run: |
          python3 06_BUILD/qa_manuscript.py --book book-01 --verbose
          echo "::notice::Manüskript prozası izlenmiyor; bu kapının tam kapsamı YEREL koşumdadır."

  killgate:
    name: kill-gate durumu (bilgi amaçlı)
    needs: gates
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: kill_gate (Kitap 1)
        # ⚠ DURUM DEĞİŞTİ (DECISIONS.md K58): kurucu, D-01 ve D-02 için
        # pratik erişimin OLMADIĞINI bildirdi. Bu iş artık "ölçüm
        # bekleniyor" diye DÜŞMEZ; erişilemezliği ve içsel ikameyi
        # RAPORLAR. Çıkış kodu 0 olması kill-gate'in GEÇTİĞİ anlamına
        # GELMEZ — `measured` hâlâ false'tur ve selftest bunu dayatır
        # (test_external_unavailable_is_not_a_pass).
        run: |
          echo "::notice::Kill-gate ÖLÇÜLMEDİ ve ölçülemez — dış doğrulama ERİŞİLEMEZ."
          echo "::notice::Çıkış kodu 0, PASS DEĞİL: ürün durumu CONDITIONAL_INTERNAL_VALIDATION."
          python3 06_BUILD/kill_gate.py --book book-01
